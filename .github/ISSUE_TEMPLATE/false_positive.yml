name: False Positive Report
description: Report a false positive finding so we can improve rule precision
title: "[False Positive]: "
labels: ["false-positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: "e.g. PS001, PS002, PS003, PS006, PS008"
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Redacted snippet or pattern
      description: Show the pattern that triggered the false positive (never paste real secrets).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this a false positive?
      description: Explain why this pattern is safe in an npm package.
    validations:
      required: true
